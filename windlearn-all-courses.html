5关：技术改变工作：筛选匹配\\风变编程.html"},{"id":"3-6","name":"设置excel样式","f":"【3】python办公自动化\\第6关：转正危机：设置excel样式\\风变编程.html"}]},{"name":"【4】Python数据分析实训课","icon":"📊","color":"linear-gradient(135deg,#9c27b0,#7b1fa2)","chapters":[{"id":"4-1","name":"数据的世界","f":"【4】Python数据分析实训课\\第1关 数据的世界：数据探索\\风变编程.html"},{"id":"4-2","name":"三问三答","f":"【4】Python数据分析实训课\\第2关 三问三答：数据分析1\\风变编程.html"},{"id":"4-3","name":"临门一脚","f":"【4】Python数据分析实训课\\第3关 临门一脚：数据可视化1\\风变编程.html"},{"id":"4-4","name":"口罩生意","f":"【4】Python数据分析实训课\\第4关 口罩生意：数据清洗\\风变编程.html"},{"id":"4-5","name":"难度升级","f":"【4】Python数据分析实训课\\第5关 难度升级：数据分析2\\风变编程.html"},{"id":"4-6","name":"看见数据","f":"【4】Python数据分析实训课\\第6关 看见数据：数据可视化2\\风变编程.html"}]}]};
let progress = JSON.parse(localStorage.getItem("windlearn_progress") || "{}");
let currentCourse = null, currentChapter = null;

function init() {
    renderCourseList();
    renderWelcomeCards();
    updateStats();
}

function renderCourseList() {
    const cl = document.getElementById("courseList");
    cl.innerHTML = "";
    courseData.courses.forEach((c, ci) => {
        let html = `<div class="course-item">
            <div class="course-header" onclick="toggleCourse(${ci})">
                <div class="course-icon" style="background:${c.color}">${c.icon}</div>
                <div class="course-info">
                    <div class="course-name">${c.name}</div>
                    <div class="course-count">${c.chapters.length} 章</div>
                </div>
                <span class="course-arrow">▶</span>
            </div>
            <div class="chapter-list">${c.chapters.map((ch, i) => 
                `<div class="chapter-item" onclick="loadChapter(${ci}, ${i})" data-cid="${ch.id}">${ch.name}</div>`
            ).join("")}</div>
        </div>`;
        cl.innerHTML += html;
    });
}

function renderWelcomeCards() {
    const wc = document.getElementById("welcomeCards");
    wc.innerHTML = courseData.courses.map((c, i) => 
        `<div class="card" onclick="openCourse(${i})">
            <div class="card-icon">${c.icon}</div>
            <div class="card-title">${c.name}</div>
            <div class="card-desc">${c.chapters.length} 章课程</div>
        </div>`
    ).join("");
}

function toggleCourse(idx) {
    const arrows = document.querySelectorAll(".course-arrow");
    const lists = document.querySelectorAll(".chapter-list");
    arrows[idx].classList.toggle("open");
    lists[idx].classList.toggle("open");
}

function openCourse(idx) {
    toggleCourse(idx);
    if (courseData.courses[idx].chapters.length > 0) {
        loadChapter(idx, 0);
    }
}

function loadChapter(ci, chi) {
    const c = courseData.courses[ci];
    const ch = c.chapters[chi];
    currentCourse = ci;
    currentChapter = chi;
    
    document.querySelectorAll(".chapter-item").forEach(el => el.classList.remove("active"));
    document.querySelector(`[data-cid="${ch.id}"]`).classList.add("active");
    
    document.getElementById("currentTitle").textContent = ch.name;
    
    const url = "file:///" + courseData.basePath + "/" + ch.f.replace(/\\/g, "/");
    document.getElementById("view0").innerHTML = `<iframe src="${url}"></iframe>`;
    
    progress[ch.id] = true;
    localStorage.setItem("windlearn_progress", JSON.stringify(progress));
    updateStats();
    
    showToast("已加载：" + ch.name);
}

function switchTab(idx) {
    document.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("active", i === idx));
    document.querySelectorAll(".view").forEach((v, i) => v.classList.toggle("active", i === idx));
}

function updateStats() {
    document.getElementById("progressCount").textContent = Object.keys(progress).length;
    let total = courseData.courses.reduce((s, c) => s + c.chapters.length, 0);
    document.getElementById("chapterCount").textContent = total;
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

init();
</script>
