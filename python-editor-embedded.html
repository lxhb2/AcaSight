<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>

<style>
* {margin:0;padding:0;box-sizing:border-box}
body {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);min-height:100vh;color:#e8e8e8}
.header {padding:15px 25px;background:rgba(0,0,0,0.4);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo {font-size:1.3rem;background:linear-gradient(90deg,#00d4ff,#7b2cbf);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
.status {font-size:.85rem;color:#888}
.container {display:flex;height:calc(100vh-60px)}
.sidebar {width:280px;background:rgba(0,0,0,0.3);border-right:1px solid rgba(255,255,255,0.1);overflow-y:auto;padding:15px}
.sidebar h3 {font-size:.9rem;color:#aaa;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.1)}
.chapter-list {list-style:none}
.chapter-list li {padding:10px 15px;border-radius:8px;cursor:pointer;font-size:.85rem;color:#bbb;margin-bottom:5px;transition:.2s}
.chapter-list li:hover {background:rgba(0,212,255,0.15);color:#fff}
.chapter-list li.active {background:rgba(0,212,255,0.25);color:#00d4ff}
.main {flex:1;display:flex;flex-direction:column;padding:15px;gap:15px}
.course-frame {flex:1;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.course-frame iframe {width:100%;height:100%;border:none}
.python-ide {height:300px;background:#1e1e1e;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.ide-header {display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#252526;border-bottom:1px solid #333}
.ide-title {color:#ccc;font-size:.9rem;display:flex;align-items:center;gap:8px}
.ide-title span {font-size:1.1rem}
.run-btn {padding:8px 20px;background:linear-gradient(135deg,#00d4ff,#7b2cbf);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:.85rem;transition:.3s}
.run-btn:hover {transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,212,255,0.4)}
.run-btn:disabled {opacity:0.5;cursor:not-allowed}
.editor-wrap {flex:1;position:relative;overflow:hidden}
.CodeMirror {height:100%;font-family:Consolas,Monaco,"Courier New",monospace;font-size:14px;line-height:1.5}
.output-panel {height:120px;background:#1e1e1e;border-top:1px solid #333;display:flex;flex-direction:column}
.output-header {padding:8px 15px;background:#252526;border-bottom:1px solid #333;color:#ccc;font-size:.8rem;display:flex;justify-content:space-between}
.output-content {flex:1;padding:10px 15px;font-family:Consolas,Monaco,monospace;font-size:13px;color:#d4d4d4;overflow-y:auto;white-space:pre-wrap}
.output-status {font-size:.75rem;padding:3px 8px;border-radius:4px}
.output-status.ready {background:rgba(76,175,80,0.2);color:#4caf50}
.output-status.loading {background:rgba(255,152,0,0.2);color:#ff9800}
.output-status.error {background:rgba(244,67,54,0.2);color:#f44336}
.toast {position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 24px;background:rgba(0,0,0,0.9);border-radius:8px;font-size:.9rem;opacity:0;transition:.3s;z-index:1000}
.toast.show {transform:translateX(-50%) translateY(0);opacity:1}
::-webkit-scrollbar {width:6px}
::-webkit-scrollbar-thumb {background:rgba(255,255,255,0.2);border-radius:3px}
</style>
</head>
<body>
<div class="header">
<div class="logo">🐍 Python 学习编辑器</div>
<div class="status" id="pyStatus">Pyodide: 等待加载</div>
</div>
<div class="container">
<aside class="sidebar">
<h3>📚 课程目录</h3>
<ul class="chapter-list" id="chapterList">
<li data-src="file:///D:/百度网盘下载/风/风变：语法+爬虫+自动化+分析/风变：语法+爬虫+自动化+分析/【1】Python基础语法/0~3关：第1个小目标：别叫我萌新/0关-千寻的名字.html">0关 - 千寻的名字</li>
<li data-src="file:///D:/百度网盘下载/风/风变：语法+爬虫+自动化+分析/风变：语法+爬虫+自动化+分析/【1】Python基础语法/0~3关：第1个小目标：别叫我萌新/1关-萌新的进化.html">1关 - 萌新的进化</li>
<li data-src="file:///D:/百度网盘下载/风/风变：语法+爬虫+自动化+分析/风变：语法+爬虫+自动化+分析/【1】Python基础语法/0~3关：第1个小目标：别叫我萌新/2关-灭霸的选择.html">2关 - 灭霸的选择</li>
<li data-src="file:///D:/百度网盘下载/风/风变：语法+爬虫+自动化+分析/风变：语法+爬虫+自动化+分析/【1】Python基础语法/0~3关：第1个小目标：别叫我萌新/3关-霍格沃兹的来信.html">3关 - 霍格沃兹的来信</li>
<li data-src="file:///D:/百度网盘下载/风/风变：语法+爬虫+自动化+分析/风变：语法+爬虫+自动化+分析/【1】Python基础语法/4~7关：第2个小目标：做出我的第一个项目/4关-收纳的艺术.html">4关 - 收纳的艺术</li>
<li data-src="file:///D:/百度网盘下载/风/风变：语法+爬虫+自动化+分析/风变：语法+爬虫+自动化+分析/【1】Python基础语法/4~7关：第2个小目标：做出我的第一个项目/5关-消灭该怎么的重复（上）.html">5关 - 消灭该怎么的重复（上）</li>
<li data-src="file:///D:/百度网盘下载/风/风变：语法+爬虫+自动化+分析/风变：语法+爬虫+自动化+分析/【1】Python基础语法/4~7关：第2个小目标：做出我的第一个项目/6关-消灭该怎么的重复（下）.html">6关 - 消灭该怎么的重复（下）</li>
<li data-src="file:///D:/百度网盘下载/风/风变：语法+爬虫+自动化+分析/风变：语法+爬虫+自动化+分析/【1】Python基础语法/4~7关：第2个小目标：做出我的第一个项目/7关-小游戏大学问.html">7关 - 小游戏大学问</li>
</ul>
</aside>
<div class="main">
<div class="course-frame">
<iframe id="courseFrame" src="about:blank"></iframe>
</div>
<div class="python-ide">
<div class="ide-header">
<div class="ide-title"><span>🐍</span> Python 代码编辑器</div>
<button class="run-btn" id="runBtn" onclick="runPython()">▶ 运行代码</button>
</div>
<div class="editor-wrap">
<textarea id="codeEditor"># 在这里编写 Python 代码
# 按 Ctrl+Enter 或点击"运行代码"执行

name = "同学"
print(f"欢迎 {name} 开始学习 Python!")

# 示例：计算 1+2+3+...+10
sum = 0
for i in range(1, 11):
    sum += i
print(f"1+2+3+...+10 = {sum}")
</textarea>
</div>
<div class="output-panel">
<div class="output-header">
<span>📤 输出结果</span>
<span class="output-status loading" id="outputStatus">等待运行</span>
</div>
<div class="output-content" id="outputContent">等待输入代码并运行...</div>
</div>
</div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
// Initialize CodeMirror editor
let editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
    mode: "python",
    theme: "pythonidea",
    lineNumbers: true,
    indentUnit: 4,
    tabSize: 4,
    indentWithTabs: false,
    autoCloseBrackets: true,
    lineWrapping: true
});

// Pyodide instance
let pyodide = null;
let isLoading = false;

// Initialize Pyodide on page load
async function initPyodide() {
    const statusEl = document.getElementById("pyStatus");
    const runBtn = document.getElementById("runBtn");
    const outputStatus = document.getElementById("outputStatus");
    const outputContent = document.getElementById("outputContent");
    
    if (isLoading) return;
    isLoading = true;
    
    outputStatus.textContent = "加载中...";
    outputStatus.className = "output-status loading";
    outputContent.textContent = "正在初始化 Python 运行环境 (Pyodide WebAssembly)...\n请稍候...";
    
    try {
        pyodide = await loadPyodide();
        statusEl.textContent = "Pyodide: ✅ 已就绪";
        statusEl.style.color = "#4caf50";
        runBtn.disabled = false;
        outputStatus.textContent = "就绪";
        outputStatus.className = "output-status ready";
        outputContent.textContent = "✅ Python 环境已就绪！\n\n可以开始编写和运行 Python 代码了。";
        showToast("Python 环境已就绪！");
    } catch (e) {
        outputContent.textContent = "❌ Pyodide 加载失败: " + e.message;
        outputStatus.textContent = "错误";
        outputStatus.className = "output-status error";
        showToast("Pyodide 加载失败");
    }
    isLoading = false;
}

// Run Python code
async function runPython() {
    const outputContent = document.getElementById("outputContent");
    const outputStatus = document.getElementById("outputStatus");
    const runBtn = document.getElementById("runBtn");
    
    if (!pyodide) {
        outputContent.textContent = "❌ Python 环境未就绪，请等待加载...";
        return;
    }
    
    const code = editor.getValue();
    outputStatus.textContent = "运行中";
    outputStatus.className = "output-status loading";
    outputContent.textContent = ">>> " + code.split("\n").join("\n>>> ") + "\n\n";
    runBtn.disabled = true;
    
    try {
        // Redirect stdout to capture print output
        await pyodide.runPythonAsync(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);
        
        // Run user code
        await pyodide.runPythonAsync(code);
        
        // Get output
        const stdout = pyodide.runPython("sys.stdout.getvalue()");
        outputContent.textContent += stdout || "(代码执行完成，无输出)";
        
        outputStatus.textContent = "完成";
        outputStatus.className = "output-status ready";
    } catch (e) {
        outputContent.textContent += "\n❌ 错误: " + e.message;
        outputStatus.textContent = "错误";
        outputStatus.className = "output-status error";
    }
    
    runBtn.disabled = false;
}

// Keyboard shortcut: Ctrl+Enter to run
editor.addKeyMap({
    "Ctrl-Enter": function(cm) {
        runPython();
    },
    "Cmd-Enter": function(cm) {
        runPython();
    }
});

// Chapter navigation
document.querySelectorAll(".chapter-list li").forEach(li => {
    li.addEventListener("click", function() {
        document.querySelectorAll(".chapter-list li").forEach(l => l.classList.remove("active"));
        this.classList.add("active");
        
        const src = this.getAttribute("data-src");
        document.getElementById("courseFrame").src = src;
        showToast("已加载: " + this.textContent);
    });
});

// Toast notification
function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

// Initialize
window.onload = initPyodide;
</script>
</body>
</html>
