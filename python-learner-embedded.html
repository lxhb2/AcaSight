let pyodide=null,curCourse=null,curChapter=null,mode="read",progress=JSON.parse(localStorage.getItem("pyLearnProgress")||"{}");

function init(){
  let tc=0;
  Object.values(COURSES).forEach(c=>tc+=c.chapters.length);
  document.getElementById("s2").textContent=tc;
  let cc=Object.keys(progress).length;
  document.getElementById("s3").textContent=cc;
  document.getElementById("s4").textContent=tc?Math.round(cc/tc*100)+"%":"0%";
  renderCourses();
  renderWelcomeCards();
  renderResources();
}

function renderCourses(){
  const cl=document.getElementById("cl");
  cl.innerHTML="";
  Object.entries(COURSES).forEach(([name,data])=>{
    let h=document.createElement("div");
    h.className="cat";
    h.innerHTML=`<div class="cat-hdr" onclick="toggleCat(this)"><div class="cat-icon" style="background:${data.color}">${data.icon}</div><div class="cat-info"><div class="cat-name">${name}</div><div class="cat-cnt">${data.chapters.length} 章</div></div><span class="cat-arrow">▶</span></div><div class="ch-list">${data.chapters.map((ch,i)=>`<div class="ch" onclick="loadCh('${name}','${ch.id}')" data-c="${name}" data-id="${ch.id}"><span class="ch-num">${ch.id}</span><span class="ch-txt">${ch.name}</span></div>`).join("")}</div>`;
    cl.appendChild(h);
  });
}

function toggleCat(el){
  el.querySelector(".cat-arrow").classList.toggle("open");
  el.nextElementSibling.classList.toggle("open");
}

function loadCh(cname,cid){
  curCourse=cname;curChapter=cid;
  document.querySelectorAll(".ch").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(`.ch[data-c="${cname}"][data-id="${cid}"]`).forEach(x=>x.classList.add("active"));
  const ch=COURSES[cname].chapters.find(x=>x.id===cid);
  if(ch){
    document.getElementById("frm").src="file:///"+ch.path.replace(/\\/g,"/");
    switchMode("read");
  }
}

function renderWelcomeCards(){
  const wc=document.getElementById("wc");
  wc.innerHTML=Object.entries(COURSES).map(([name,data])=>`<div class="card" onclick="openCourse('${name}')"><div class="card-i">${data.icon}</div><div class="card-t">${name}</div><div class="card-d">${data.chapters.length} 章</div></div>`).join("");
}

function openCourse(name){
  curCourse=name;
  const el=document.querySelector(`.cat-hdr`);
  if(el)toggleCat(el);
  const ch=COURSES[name].chapters[0];
  if(ch)loadCh(name,ch.id);
}

function renderResources(){
  const rl=document.getElementById("rl");
  rl.innerHTML=`<div class="r-sec"><div class="r-sec-t">📖 课程讲义</div><div class="r-item"><div class="r-ico">📕</div><div class="r-info"><div class="r-name">点击左侧章节</div><div class="r-type">查看课程内容</div></div></div></div><div class="r-sec"><div class="r-sec-t">🐍 配套代码</div><div class="r-item"><div class="r-ico">📄</div><div class="r-info"><div class="r-name">实操模式</div><div class="r-type">编写运行代码</div></div></div></div>`;
}

function switchMode(m){
  mode=m;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.m===m));
  document.querySelectorAll(".view").forEach((v,i)=>{
    v.classList.toggle("on",m==="read"?i===1:m==="code"?i===2:i===3);
  });
}

function showHelp(){
  alert("📖 使用指南\n\n1. 点击左侧课程展开章节\n2. 点击章节名称加载课程内容\n3. 切换「阅读/实操/练习」模式\n4. 代码模式可运行 Python\n\n💡 提示：课程已预装，点击即可学习！");
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

async function runPy(){
  const ed=document.getElementById("ed"),oc=document.getElementById("oc"),ost=document.getElementById("ost");
  if(!pyodide){ost.textContent="加载中";ost.className="st ld";oc.textContent="正在初始化 Pyodide...";
    try{pyodide=await loadPyodide();ost.textContent="就绪";ost.className="st ok";}catch(e){oc.textContent="加载失败: "+e.message;return;}
  }
  ost.textContent="运行中";oc.textContent+="\n\n>>> "+ed.value.split("\n").join("\n>>> ")+"\n";
  try{let r=await pyodide.runPythonAsync(ed.value);if(r)oc.textContent+="\n"+r.toString();}catch(e){oc.textContent+="\n❌ "+e.message;}
  ost.textContent="完成";setTimeout(()=>{ost.textContent="就绪";ost.className="st ok";},1500);
}

document.getElementById("ed").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.ctrlKey){e.preventDefault();runPy();}});
window.onload=init;
</script>
