<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 编程学习中心</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --card: #1a1a25;
            --hover: #222235;
            --border: rgba(255,255,255,0.06);
            --cyan: #00d4ff;
            --violet: #a78bfa;
            --emerald: #34d399;
            --amber: #fbbf24;
            --text: #e2e8f0;
            --muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
        }

        /* 背景 */
        .bg {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 80%, rgba(167,139,250,0.08) 0%, transparent 50%);
        }

        .app {
            display: grid; grid-template-columns: 320px 1fr;
            height: 100vh; position: relative; z-index: 1;
        }

        /* 侧边栏 */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
        }

        .sidebar-header {
            padding: 24px; border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
        }
        .brand-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 700; color: white;
        }
        .brand h1 { font-size: 18px; font-weight: 700; }
        .brand span { font-size: 12px; color: var(--muted); }

        .stats {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        }
        .stat {
            background: var(--card); border-radius: 10px; padding: 12px; text-align: center;
        }
        .stat-val { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--cyan); }
        .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

        /* 课程列表 */
        .courses {
            flex: 1; overflow-y: auto; padding: 16px;
        }
        .courses::-webkit-scrollbar { width: 4px; }
        .courses::-webkit-scrollbar-thumb { background: var(--card); border-radius: 2px; }

        .cat { margin-bottom: 16px; }
        .cat-header {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; background: var(--card); border-radius: 10px;
            cursor: pointer; transition: all 0.2s; margin-bottom: 6px;
        }
        .cat-header:hover { background: var(--hover); }
        .cat-header.open { background: var(--hover); border-left: 3px solid var(--cyan); }
        .cat-icon { font-size: 18px; }
        .cat-info { flex: 1; }
        .cat-name { font-size: 14px; font-weight: 600; }
        .cat-meta { font-size: 11px; color: var(--muted); }
        .cat-arrow { color: var(--muted); font-size: 10px; transition: transform 0.2s; }
        .cat-header.open .cat-arrow { transform: rotate(180deg); color: var(--cyan); }

        .lessons { display: none; padding-left: 8px; }
        .lessons.open { display: block; }

        .lesson {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            transition: all 0.2s; margin-bottom: 2px;
        }
        .lesson:hover { background: var(--card); }
        .lesson.active { background: var(--hover); }
        .lesson.done { opacity: 0.7; }

        .lesson-num {
            width: 26px; height: 26px; background: var(--card); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace;
            color: var(--muted);
        }
        .lesson.active .lesson-num { background: var(--cyan); color: var(--bg); }
        .lesson.done .lesson-num { background: var(--emerald); color: white; }

        .lesson-title {
            flex: 1; font-size: 13px; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .lesson.active .lesson-title, .lesson.done .lesson-title { color: var(--text); }

        .lesson-check {
            width: 8px; height: 8px; border-radius: 50%; background: var(--card);
        }
        .lesson.done .lesson-check { background: var(--emerald); }

        /* 主内容 */
        .main { display: flex; flex-direction: column; overflow: hidden; }

        .topbar {
            padding: 16px 24px; background: rgba(18,18,26,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .topbar-left { display: flex; align-items: center; gap: 14px; }
        .menu-btn {
            display: none; width: 40px; height: 40px; background: var(--card);
            border: 1px solid var(--border); border-radius: 8px; color: var(--muted);
            cursor: pointer; align-items: center; justify-content: center;
        }
        .breadcrumb { font-size: 14px; color: var(--muted); }
        .breadcrumb strong { color: var(--text); font-weight: 500; }

        .actions { display: flex; gap: 10px; }
        .btn {
            padding: 10px 18px; background: var(--card); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s; font-family: inherit;
        }
        .btn:hover { background: var(--hover); }
        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            border: none; color: white; font-weight: 600;
        }
        .btn-primary:hover { box-shadow: 0 4px 20px rgba(0,212,255,0.3); }

        /* 内容 */
        .content { flex: 1; overflow: hidden; position: relative; }

        /* 欢迎页 */
        .welcome {
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px; text-align: center;
        }
        .welcome-icon {
            width: 120px; height: 120px;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            border-radius: 32px; font-size: 56px; display: flex;
            align-items: center; justify-content: center; margin-bottom: 32px;
            box-shadow: 0 20px 60px rgba(0,212,255,0.25);
        }
        .welcome h1 {
            font-size: 32px; font-weight: 700; margin-bottom: 12px;
            background: linear-gradient(90deg, var(--text), var(--cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome p { font-size: 15px; color: var(--muted); max-width: 480px; margin-bottom: 36px; }

        .cards { display: flex; gap: 16px; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 14px;
            padding: 24px; width: 180px; text-align: left; cursor: pointer;
            transition: all 0.3s;
        }
        .card:hover { transform: translateY(-6px); border-color: var(--cyan); }
        .card-icon { font-size: 28px; margin-bottom: 12px; }
        .card h3 { font-size: 14px; margin-bottom: 6px; }
        .card p { font-size: 12px; color: var(--muted); }

        /* 学习器 */
        .learner { display: none; flex-direction: column; height: 100%; }
        .learner.active { display: flex; }

        .learner-bar {
            padding: 12px 24px; background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-btns { display: flex; gap: 6px; }
        .nav-btn {
            width: 36px; height: 36px; background: var(--card);
            border: 1px solid var(--border); border-radius: 8px; color: var(--muted);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .learner-pos { font-size: 13px; font-family: 'JetBrains Mono', monospace; color: var(--muted); }
        .bar-actions { display: flex; gap: 8px; }

        .frame { flex: 1; position: relative; background: #000; }
        .frame-iframe { width: 100%; height: 100%; border: none; }

        .frame-loader {
            position: absolute; inset: 0; background: var(--bg);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; z-index: 5;
        }
        .frame-loader.hidden { display: none; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border);
            border-top-color: var(--cyan); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .frame-loader span { color: var(--muted); font-size: 13px; }

        /* 提示 */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            padding: 12px 20px; background: var(--card);
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 13px; transform: translateX(120%); transition: transform 0.3s;
            z-index: 100; backdrop-filter: blur(10px);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-color: var(--emerald); background: rgba(52,211,153,0.15); color: var(--emerald); }

        /* 响应式 */
        @media (max-width: 768px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { position: fixed; left: 0; top: 0; width: 320px; height: 100%; transform: translateX(-100%); transition: transform 0.3s; z-index: 50; }
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: flex; }
            .cards { flex-direction: column; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">&lt;/&gt;</div>
                    <div>
                        <h1>Python 学习</h1>
                        <span>编程学习中心</span>
                    </div>
                </div>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-val" id="statTotal">0</div>
                        <div class="stat-label">总课程</div>
                    </div>
                    <div class="stat">
                        <div class="stat-val" id="statDone">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                    <div class="stat">
                        <div class="stat-val" id="statPct">0%</div>
                        <div class="stat-label">进度</div>
                    </div>
                </div>
            </div>
            <div class="courses" id="courses">
                <div style="padding:40px 20px;text-align:center;color:var(--muted);">
                    <p style="font-size:40px;margin-bottom:12px;">📁</p>
                    <p style="font-size:13px;">点击下方「导入课程」按钮<br>选择风变编程文件夹</p>
                </div>
            </div>
        </aside>

        <!-- 主面板 -->
        <main class="main">
            <div class="topbar">
                <div class="topbar-left">
                    <button class="menu-btn" onclick="toggleSidebar()">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h14M3 10h14M3 14h14"/>
                        </svg>
                    </button>
                    <div class="breadcrumb" id="breadcrumb">欢迎使用</div>
                </div>
                <div class="actions">
                    <button class="btn" onclick="goHome()">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-9M3 9h6M3 9v6"/>
                        </svg>
                        首页
                    </button>
                    <button class="btn btn-primary" onclick="importFolder()">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7V5a2 2 0 012-2h4l2 2h6a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/>
                        </svg>
                        导入课程
                    </button>
                </div>
            </div>

            <div class="content">
                <!-- 欢迎页 -->
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🐍</div>
                    <h1>Python 编程学习中心</h1>
                    <p>导入你的风变编程课程文件夹，开始高效学习。支持课程导航、进度保存、章节管理。</p>
                    <div class="cards">
                        <div class="card" onclick="importFolder()">
                            <div class="card-icon">📂</div>
                            <h3>导入课程</h3>
                            <p>选择课程文件夹</p>
                        </div>
                        <div class="card" onclick="showHelp()">
                            <div class="card-icon">❓</div>
                            <h3>使用帮助</h3>
                            <p>了解如何操作</p>
                        </div>
                        <div class="card" onclick="clearData()">
                            <div class="card-icon">🗑️</div>
                            <h3>清除数据</h3>
                            <p>重置学习进度</p>
                        </div>
                    </div>
                </div>

                <!-- 学习器 -->
                <div class="learner" id="learner">
                    <div class="learner-bar">
                        <div class="nav-btns">
                            <button class="nav-btn" id="prevBtn" onclick="prevLesson()">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M15 8l-6 6M15 8H9M15 8v6"/>
                                </svg>
                            </button>
                            <button class="nav-btn" id="nextBtn" onclick="nextLesson()">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 8l6 6M9 8h6M9 8v6"/>
                                </svg>
                            </button>
                        </div>
                        <div class="learner-pos" id="learnerPos">0 / 0</div>
                        <div class="bar-actions">
                            <button class="btn" onclick="markDone()">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12l5 5L20 7"/>
                                </svg>
                                完成
                            </button>
                            <button class="btn" onclick="reloadFrame()">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 4v4h4M23 8v-4h-4M3.5 9a9 9 0 1015-3"/>
                                </svg>
                                刷新
                            </button>
                        </div>
                    </div>
                    <div class="frame">
                        <div class="frame-loader" id="frameLoader">
                            <div class="spinner"></div>
                            <span>加载中...</span>
                        </div>
                        <iframe class="frame-iframe" id="frameIframe" onload="onLoad()"></iframe>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>
    <input type="file" id="folderInput" webkitdirectory multiple style="display:none" onchange="handleFiles(event)">

    <script>
        // ============ 数据 ============
        const cats = {
            syntax: { name: 'Python 基础语法', icon: '📚' },
            crawler: { name: 'Python 爬虫精讲', icon: '🕷️' },
            automation: { name: '办公自动化', icon: '⚡' },
            analysis: { name: '数据分析实战', icon: '📊' }
        };

        const catMap = {
            '【1】Python基础语法': 'syntax',
            '【2】Python爬虫精讲': 'crawler',
            '【3】python办公自动化': 'automation',
            '【4】Python数据分析实战': 'analysis'
        };

        let lessons = [];
        let current = -1;
        let progress = {};

        // ============ 导入 ============
        function importFolder() {
            document.getElementById('folderInput').click();
        }

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            lessons = [];
            files.forEach(file => {
                const path = file.webkitRelativePath || file.name;
                for (const [folder, cat] of Object.entries(catMap)) {
                    if (path.includes(folder)) {
                        const name = cleanName(file.name);
                        if (name) {
                            lessons.push({ id: 'l_' + lessons.length, name, file, cat });
                        }
                        break;
                    }
                }
            });

            // 排序
            lessons.sort((a, b) => {
                const n1 = (a.name.match(/\d+/) || [0])[0];
                const n2 = (b.name.match(/\d+/) || [0])[0];
                return +n1 - +n2;
            });

            render();
            updateStats();
            toast('已导入 ' + lessons.length + ' 个课程', 'success');

            if (lessons.length) loadLesson(0);
        }

        function cleanName(fn) {
            let n = fn.replace(/\.html?$/i, '');
            // GBK
            if (/^[\u0000-\u00ff]+$/.test(n)) {
                try {
                    const b = [];
                    for (let i = 0; i < n.length; i++) b.push(n.charCodeAt(i));
                    n = new TextDecoder('gbk').decode(new Uint8Array(b));
                } catch (e) {}
            }
            return n.replace(/^\d+关[-_\s]*/, '') || fn;
        }

        // ============ 渲染 ============
        function render() {
            const panel = document.getElementById('courses');
            const grouped = {};
            Object.keys(cats).forEach(k => grouped[k] = []);
            lessons.forEach(l => { if (grouped[l.cat]) grouped[l.cat].push(l); });

            let html = '';
            for (const [id, cat] of Object.entries(cats)) {
                const items = grouped[id];
                if (!items.length) continue;
                const done = items.filter(i => progress[i.id]).length;
                html += `
                    <div class="cat">
                        <div class="cat-header" onclick="toggleCat('${id}')">
                            <span class="cat-icon">${cat.icon}</span>
                            <div class="cat-info">
                                <div class="cat-name">${cat.name}</div>
                                <div class="cat-meta">${done}/${items.length} 已完成</div>
                            </div>
                            <span class="cat-arrow">▼</span>
                        </div>
                        <div class="lessons" id="list-${id}">
                            ${items.map((item, i) => `
                                <div class="lesson ${progress[item.id] ? 'done' : ''}" 
                                     data-idx="${lessons.indexOf(item)}"
                                     onclick="loadLesson(${lessons.indexOf(item)})">
                                    <div class="lesson-num">${i + 1}</div>
                                    <div class="lesson-title">${item.name}</div>
                                    <div class="lesson-check"></div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            panel.innerHTML = html || `<div style="padding:40px 20px;text-align:center;color:var(--muted);">
                <p style="font-size:40px;margin-bottom:12px;">📁</p>
                <p style="font-size:13px;">点击下方「导入课程」按钮<br>选择风变编程文件夹</p>
            </div>`;
        }

        function toggleCat(id) {
            const h = document.querySelector(`[onclick="toggleCat('${id}')"]`);
            const l = document.getElementById('list-' + id);
            h.classList.toggle('open');
            l.classList.toggle('open');
        }

        function updateStats() {
            const total = lessons.length;
            const done = lessons.filter(l => progress[l.id]).length;
            const pct = total ? Math.round(done / total * 100) : 0;
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statDone').textContent = done;
            document.getElementById('statPct').textContent = pct + '%';
        }

        // ============ 学习 ============
        function loadLesson(idx) {
            if (idx < 0 || idx >= lessons.length) return;
            current = idx;
            const lesson = lessons[idx];
            const cat = cats[lesson.cat];

            // 激活
            document.querySelectorAll('.lesson').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-idx="${idx}"]`)?.classList.add('active');

            // 面包屑
            document.getElementById('breadcrumb').innerHTML = `${cat.name} <strong>/</strong> ${lesson.name}`;

            // 切换
            document.getElementById('welcome').classList.add('hidden');
            document.getElementById('learner').classList.add('active');
            document.getElementById('frameLoader').classList.remove('hidden');

            // 加载
            document.getElementById('frameIframe').src = URL.createObjectURL(lesson.file);

            updateNav();
        }

        function updateNav() {
            document.getElementById('prevBtn').disabled = current <= 0;
            document.getElementById('nextBtn').disabled = current >= lessons.length - 1;
            document.getElementById('learnerPos').textContent = (current + 1) + ' / ' + lessons.length;
        }

        function prevLesson() { if (current > 0) loadLesson(current - 1); }
        function nextLesson() { if (current < lessons.length - 1) loadLesson(current + 1); }
        function onLoad() { document.getElementById('frameLoader').classList.add('hidden'); }
        function reloadFrame() {
            document.getElementById('frameLoader').classList.remove('hidden');
            document.getElementById('frameIframe').contentWindow?.location.reload();
        }

        function markDone() {
            if (current < 0) return;
            progress[lessons[current].id] = true;
            render();
            updateStats();
            toast('已标记完成 ✓', 'success');
        }

        function goHome() {
            current = -1;
            document.getElementById('welcome').classList.remove('hidden');
            document.getElementById('learner').classList.remove('active');
            document.getElementById('breadcrumb').textContent = '欢迎使用';
        }

        // ============ 工具 ============
        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (type ? ' ' + type : '');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function showHelp() {
            alert('📖 使用指南\n\n1. 点击「导入课程」按钮\n2. 选择风变编程课程文件夹\n3. 文件夹应包含：【1】Python基础语法、【2】Python爬虫精讲 等子文件夹\n4. 点击左侧课程即可开始学习\n5. 标记「完成」可追踪学习进度');
        }

        function clearData() {
            if (confirm('确定清除所有学习进度吗？')) {
                lessons = [];
                current = -1;
                progress = {};
                localStorage.removeItem('pyLearn');
                render();
                updateStats();
                goHome();
                toast('已清除所有数据');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
    </script>
</body>
</html>
