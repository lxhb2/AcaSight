function renderCourseList() {
    const cl = document.getElementById("courseList");
    cl.innerHTML = "";
    courseData.courses.forEach((c, ci) => {
        let html = `<div class="course-item">
            <div class="course-header" onclick="toggleCourse(${ci})">
                <div class="course-icon" style="background:${c.color}">${c.icon}</div>
                <div class="course-info">
                    <div class="course-name">${c.name}</div>
                    <div class="course-count">${c.chapters.length} 章</div>
                </div>
                <span class="course-arrow">▶</span>
            </div>
            <div class="chapter-list">${c.chapters.map((ch, i) => 
                `<div class="chapter-item" onclick="loadChapter(${ci}, ${i})" data-cid="${ch.id}">${ch.name}</div>`
            ).join("")}</div>
        </div>`;
        cl.innerHTML += html;
    });
}

function toggleCourse(idx) {
    document.querySelectorAll(".course-arrow")[idx].classList.toggle("open");
    document.querySelectorAll(".chapter-list")[idx].classList.toggle("open");
}

function loadChapter(ci, chi) {
    const c = courseData.courses[ci];
    const ch = c.chapters[chi];
    currentCourse = ci;
    currentChapter = chi;
    
    document.querySelectorAll(".chapter-item").forEach(el => el.classList.remove("active"));
    document.querySelector(`[data-cid="${ch.id}"]`).classList.add("active");
    
    document.getElementById("currentTitle").textContent = ch.name;
    
    const url = "file:///" + courseData.basePath + "/" + ch.f.replace(/\\/g, "/");
    document.getElementById("studyFrame").src = url;
    
    // 加载练习题
    loadExercises(ch.id);
    
    // 保存进度
    progress[ch.id] = true;
    localStorage.setItem("windlearn_progress", JSON.stringify(progress));
    document.getElementById("progressCount").textContent = Object.keys(progress).length;
    
    showToast("已加载: " + ch.name);
}

// 加载练习题
function loadExercises(chapterId) {
    const el = document.getElementById("exercisesList");
    const ex = exercisesDB[chapterId];
    
    if (!ex) {
        el.innerHTML = `<div class="exercise-item">
            <div class="exercise-title">暂无练习题</div>
            <div class="exercise-difficulty">请尝试其他章节</div>
        </div>`;
        return;
    }
    
    const diffLabels = {1:"⭐",2:"⭐⭐",3:"⭐⭐⭐",4:"⭐⭐⭐⭐"};
    el.innerHTML = `<div class="exercise-item active" onclick="selectExercise(this, '${ex.items[0].q}', '${ex.items[0].a}', '${ex.items[0].hint || ''}')">
        <div class="exercise-title">${ex.title}</div>
        <div class="exercise-difficulty"><span class="diff-${ex.difficulty}">${diffLabels[ex.difficulty]}</span> ${ex.items.length} 题</div>
    </div>` + ex.items.slice(1).map(item => `
        <div class="exercise-item" onclick="selectExercise(this, '${item.q}', '${item.a}', '${item.hint || ''}')">
            <div class="exercise-title">${item.q}</div>
            <div class="exercise-difficulty"><span class="diff-${ex.difficulty}">${diffLabels[ex.difficulty]}</span> 编程题</div>
        </div>
    `).join("");
}

function selectExercise(el, q, a, hint) {
    document.querySelectorAll(".exercise-item").forEach(e => e.classList.remove("active"));
    el.classList.add("active");
    currentExercise = {question: q, answer: a, hint: hint};
    editor.setValue(`# 题目: ${q}\n# 提示: ${hint || '暂无提示'}\n\n`);
    document.getElementById("outputContent").textContent = "请编写代码解答上述题目...";
}

// 切换学习/练习模式
function switchMode(mode) {
    document.querySelectorAll(".mode-tab").forEach(t => {
        t.classList.toggle("active", t.textContent.includes(mode === "study" ? "学习" : "练习"));
    });
    document.getElementById("studyView").classList.toggle("active", mode === "study");
    document.getElementById("practiceView").classList.toggle("active", mode === "practice");
}

// 初始化编辑器
function initEditor() {
    editor = CodeMirror.fromTextArea(document.getElementById("codeEditor"), {
        mode: "python",
        theme: "pythonidea",
        lineNumbers: true,
        indentUnit: 4,
        autoCloseBrackets: true
    });
    
    editor.addKeyMap({"Ctrl-Enter": runPython, "Cmd-Enter": runPython});
    
    initPyodide();
}

async function initPyodide() {
    try {
        pyodide = await loadPyodide();
        showToast("Python 环境已就绪");
    } catch(e) {
        console.log("Pyodide load error:", e);
    }
}

async function runPython() {
    const outputContent = document.getElementById("outputContent");
    const outputStatus = document.getElementById("outputStatus");
    
    if (!pyodide) {
        outputContent.textContent = "Python 环境未就绪...";
        return;
    }
    
    outputStatus.textContent = "运行中";
    outputStatus.className = "output-status status-loading";
    outputContent.textContent = ">>> " + editor.getValue().split("\n").join("\n>>> ") + "\n\n";
    
    try {
        await pyodide.runPythonAsync("import sys; from io import StringIO; sys.stdout = StringIO()");
        await pyodide.runPythonAsync(editor.getValue());
        const output = pyodide.runPython("sys.stdout.getvalue()");
        outputContent.textContent += output || "(执行完成)";
        outputStatus.textContent = "完成";
        outputStatus.className = "output-status status-ready";
    } catch(e) {
        outputContent.textContent += "\n❌ 错误: " + e.message;
        outputStatus.textContent = "错误";
        outputStatus.className = "output-status status-error";
    }
}

// AI 功能
async function checkAI() {
    try {
        const res = await fetch("http://localhost:11434/api/tags");
        if (res.ok) {
            document.getElementById("aiStatus").textContent = "在线";
            document.getElementById("aiStatus").className = "ai-status online";
        }
    } catch(e) {
        document.getElementById("aiStatus").textContent = "离线";
        document.getElementById("aiStatus").className = "ai-status offline";
    }
}

async function askAI() {
    const input = document.getElementById("aiInput");
    const question = input.value.trim();
    if (!question) return;
    
    const chat = document.getElementById("aiChat");
    chat.innerHTML += `<div class="ai-message user">${question}</div>`;
    chat.innerHTML += `<div class="ai-message ai">正在思考...</div>`;
    input.value = "";
    chat.scrollTop = chat.scrollHeight;
    
    // 构建上下文提示
    let context = `你是Python学习助手。当前课程: ${currentChapter !== null ? courseData.courses[currentCourse]?.chapters[currentChapter]?.name || '未知' : '未选择'}`;
    if (currentExercise) {
        context += `\n当前练习题: ${currentExercise.question}`;
        context += `\n参考代码: ${currentExercise.answer}`;
    }
    
    try {
        const res = await fetch("http://localhost:11434/api/generate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                model: aiModel,
                prompt: context + "\n\n用户问题: " + question + "\n\n请用中文回答，代码用```python包裹",
                stream: false
            })
        });
        
        const data = await res.json();
        const answer = data.response || "AI 响应失败";
        
        chat.removeChild(chat.lastChild);
        chat.innerHTML += `<div class="ai-message ai">${answer.replace(/\n/g, "<br>")}</div>`;
    } catch(e) {
        chat.removeChild(chat.lastChild);
        chat.innerHTML += `<div class="ai-message ai">❌ AI 连接失败: ${e.message}</div>`;
    }
    
    chat.scrollTop = chat.scrollHeight;
}

function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

window.onload = init;
</script>
