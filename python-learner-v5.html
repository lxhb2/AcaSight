function init(){
  document.getElementById("cc").textContent=Object.keys(progress).length;
  let total=COURSEDATA.targets.reduce((s,t)=>s+t.chapters.length,0);
  document.getElementById("tc").textContent=total;
  document.getElementById("pc").textContent=total?Math.round(Object.keys(progress).length/total*100)+"%":"0%";
  renderCourses();
  renderWelcomeCards();
  renderResources();
}

function renderCourses(){
  const cl=document.getElementById("cl");
  cl.innerHTML="";
  COURSEDATA.targets.forEach((tgt,i)=>{
    let h=document.createElement("div");
    h.className="cat";
    h.innerHTML=`<div class="cat-hdr" onclick="toggleCat(this)"><div class="cat-icon" style="background:linear-gradient(135deg,hsl(${i*60},70%,50%),hsl(${i*60+30},70%,40%))">🎯</div><div class="cat-info"><div class="cat-name">${tgt.name}</div><div class="cat-cnt">${tgt.chapters.length} 章</div></div><span class="cat-arrow">▶</span></div><div class="ch-list">${tgt.chapters.map((ch,idx)=>`<div class="ch" onclick="loadCh(${i},'${ch.id}','${ch.name}')" data-t="${i}" data-id="${ch.id}"><span class="ch-num">第${ch.id}关</span><span class="ch-txt">${ch.name}</span></div>`).join("")}</div>`;
    cl.appendChild(h);
  });
}

function toggleCat(el){
  el.querySelector(".cat-arrow").classList.toggle("open");
  el.nextElementSibling.classList.toggle("open");
}

function loadCh(tidx,cid,cname){
  curTarget=tidx;curChapter=cid;
  document.querySelectorAll(".ch").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(`.ch[data-t="${tidx}"][data-id="${cid}"]`).forEach(x=>x.classList.add("active"));
  
  // 加载课程内容
  if(LESSONFILES[cid]){
    document.getElementById("frm").src="file:///"+LESSONFILES[cid].replace(/\\/g,"/");
    switchMode("read");
    
    // 保存进度
    progress[cid]=true;
    localStorage.setItem("pyLearnProgress",JSON.stringify(progress));
    document.getElementById("cc").textContent=Object.keys(progress).length;
    let total=COURSEDATA.targets.reduce((s,t)=>s+t.chapters.length,0);
    document.getElementById("pc").textContent=Math.round(Object.keys(progress).length/total*100)+"%";
    
    showToast(`已加载：第${cid}关 - ${cname}`);
  }else{
    showToast("课程文件未找到");
  }
}

function renderWelcomeCards(){

}

function openTarget(tidx){
  curTarget=tidx;
  const el=document.querySelectorAll(".cat-hdr")[tidx];
  if(el)toggleCat(el);
  const ch=COURSEDATA.targets[tidx].chapters[0];
  if(ch)loadCh(tidx,ch.id,ch.name);
}

function renderResources(){

function switchMode(m){
  mode=m;

  });
}

function showHelp(){
  alert("📖 使用指南\n\n1. 点击左侧目标展开章节列表\n2. 点击章节名称加载课程内容\n3. 切换「阅读/实操/练习」模式\n4. 代码模式可运行 Python\n\n💡 提示：学习进度自动保存！");
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

async function runPy(){
  const ed=document.getElementById("ed"),oc=document.getElementById("oc"),ost=document.getElementById("ost");
  if(!pyodide){ost.textContent="加载中";ost.className="st ld";oc.textContent="正在初始化 Pyodide...";
    try{pyodide=await loadPyodide();ost.textContent="就绪";ost.className="st ok";}catch(e){oc.textContent="加载失败: "+e.message;return;}
  }
  ost.textContent="运行中";oc.textContent+="\n\n>>> "+ed.value.split("\n").join("\n>>> ")+"\n";
  try{let r=await pyodide.runPythonAsync(ed.value);if(r)oc.textContent+="\n"+r.toString();}catch(e){oc.textContent+="\n❌ "+e.message;}
  ost.textContent="完成";setTimeout(()=>{ost.textContent="就绪";ost.className="st ok";},1500);
}

document.getElementById("ed").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.ctrlKey){e.preventDefault();runPy();}});
window.onload=init;
</script>
