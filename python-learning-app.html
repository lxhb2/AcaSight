<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 编程学习中心</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #111318;
            --bg-tertiary: #1a1d24;
            --bg-card: #22262f;
            --bg-elevated: #2a2f3a;
            --text-primary: #f0f2f5;
            --text-secondary: #8b919d;
            --text-muted: #5c6370;
            --accent-primary: #6366f1;
            --accent-secondary: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --success: #22c55e;
            --warning: #f59e0b;
            --border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* 背景 */
        .bg-animation {
            position: fixed; inset: 0; z-index: 0; overflow: hidden;
        }
        .bg-orb {
            position: absolute; border-radius: 50%; filter: blur(100px);
            opacity: 0.3; animation: float 20s ease-in-out infinite;
        }
        .bg-orb-1 { width: 500px; height: 500px; background: var(--accent-primary); top: -150px; right: -100px; }
        .bg-orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -100px; left: -50px; animation-delay: -10s; }
        .bg-orb-3 { width: 300px; height: 300px; background: #06b6d4; top: 50%; left: 50%; opacity: 0.15; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(20px, -30px) scale(1.05); }
            50% { transform: translate(-10px, 20px) scale(0.95); }
            75% { transform: translate(-30px, -10px) scale(1.02); }
        }

        .app-layout { display: grid; grid-template-columns: 320px 1fr; height: 100vh; position: relative; z-index: 1; }

        /* 侧边栏 */
        .sidebar {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); }
        
        .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .brand-logo {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 900; box-shadow: 0 4px 20px var(--accent-glow);
        }
        .brand-text h1 { font-size: 18px; font-weight: 700; background: linear-gradient(90deg, var(--text-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-text span { font-size: 12px; color: var(--text-muted); }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat-card { background: var(--bg-tertiary); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
        .stat-value { font-size: 20px; font-weight: 700; color: var(--accent-secondary); }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .course-nav { flex: 1; overflow-y: auto; padding: 16px; }
        .course-nav::-webkit-scrollbar { width: 4px; }
        .course-nav::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 2px; }

        .course-section { margin-bottom: 24px; }
        .course-section-header {
            display: flex; align-items: center; gap: 10px; padding: 12px 14px;
            background: var(--bg-tertiary); border-radius: var(--radius-sm); cursor: pointer;
            transition: all 0.2s; margin-bottom: 10px;
        }
        .course-section-header:hover { background: var(--bg-card); }
        .course-section-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .course-section-info { flex: 1; }
        .course-section-name { font-size: 14px; font-weight: 600; }
        .course-section-meta { font-size: 11px; color: var(--text-muted); }
        .course-section-arrow { color: var(--text-muted); transition: transform 0.2s; }
        .course-section-header.expanded .course-section-arrow { transform: rotate(180deg); }

        .course-items { display: none; padding-left: 10px; }
        .course-items.expanded { display: block; }

        .course-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 14px;
            border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; margin-bottom: 4px;
            position: relative;
        }
        .course-item::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 0; background: var(--accent-primary); border-radius: 2px; transition: height 0.2s;
        }
        .course-item:hover { background: var(--bg-tertiary); }
        .course-item:hover::before { height: 60%; }
        .course-item.active { background: linear-gradient(90deg, var(--bg-card), transparent); }
        .course-item.active::before { height: 80%; }

        .course-item-num { width: 28px; height: 28px; background: var(--bg-elevated); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--text-secondary); }
        .course-item.active .course-item-num { background: var(--accent-primary); color: white; }
        .course-item-name { flex: 1; font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .course-item.active .course-item-name { color: var(--text-primary); }
        .course-item-status { width: 8px; height: 8px; border-radius: 50%; background: var(--bg-elevated); }
        .course-item.completed .course-item-status { background: var(--success); }

        /* 主内容 */
        .main-content { display: flex; flex-direction: column; overflow: hidden; }

        .top-bar {
            padding: 16px 24px;
            background: rgba(17, 19, 24, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; z-index: 100;
        }
        .top-bar-left { display: flex; align-items: center; gap: 16px; }
        .menu-toggle {
            display: none; width: 40px; height: 40px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary);
            cursor: pointer; align-items: center; justify-content: center;
        }
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .breadcrumb-sep { color: var(--text-muted); }
        .breadcrumb-item { color: var(--text-secondary); }
        .breadcrumb-item.current { color: var(--text-primary); font-weight: 500; }

        .top-bar-actions { display: flex; gap: 10px; }
        .action-btn {
            padding: 10px 18px; background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 13px;
            cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;
        }
        .action-btn:hover { background: var(--bg-card); color: var(--text-primary); }
        .action-btn.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none; color: white;
        }
        .action-btn.primary:hover { box-shadow: 0 4px 20px var(--accent-glow); transform: translateY(-1px); }

        .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* 欢迎页 */
        .welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; }
        .welcome-hero {
            width: 140px; height: 140px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 36px; display: flex; align-items: center; justify-content: center;
            font-size: 64px; margin-bottom: 32px; box-shadow: 0 20px 60px var(--accent-glow);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 20px 60px var(--accent-glow); }
            50% { box-shadow: 0 30px 80px var(--accent-glow), 0 0 100px var(--accent-glow); }
        }
        .welcome-title { font-size: 32px; font-weight: 700; margin-bottom: 16px; background: linear-gradient(90deg, var(--text-primary), var(--accent-secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .welcome-desc { font-size: 16px; color: var(--text-secondary); max-width: 500px; margin-bottom: 40px; line-height: 1.7; }

        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 900px; width: 100%; }
        .course-card {
            background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 28px; text-align: left; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
        }
        .course-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--card-color); transform: scaleX(0); transition: transform 0.3s;
        }
        .course-card:hover { transform: translateY(-6px); border-color: var(--card-color); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        .course-card:hover::before { transform: scaleX(1); }
        .course-card-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 18px; background: var(--card-color); opacity: 0.9; }
        .course-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .course-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 0; }

        /* 学习框架 */
        .learning-frame { flex: 1; display: none; flex-direction: column; }
        .learning-frame.active { display: flex; }

        .frame-toolbar { padding: 12px 24px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .frame-nav { display: flex; gap: 8px; }
        .frame-nav-btn { width: 36px; height: 36px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .frame-nav-btn:hover:not(:disabled) { background: var(--bg-card); color: var(--text-primary); }
        .frame-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .frame-progress { font-size: 13px; color: var(--text-muted); }

        .frame-container { flex: 1; position: relative; background: var(--bg-primary); }
        .learning-iframe { width: 100%; height: 100%; border: none; background: #1a1a1a; }

        .frame-loading { position: absolute; inset: 0; background: var(--bg-primary); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .frame-loading.hidden { display: none; }
        .loader-ring { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .frame-loading span { color: var(--text-muted); font-size: 13px; }

        .error-toast { position: fixed; bottom: 24px; right: 24px; padding: 14px 24px; background: #ef4444; color: white; border-radius: var(--radius-sm); font-size: 13px; box-shadow: var(--shadow); transform: translateX(120%); transition: transform 0.3s ease; z-index: 1000; }
        .error-toast.show { transform: translateX(0); }

        @media (max-width: 900px) {
            .app-layout { grid-template-columns: 1fr; }
            .sidebar { position: fixed; left: 0; top: 0; width: 320px; height: 100vh; transform: translateX(-100%); transition: transform 0.3s; z-index: 200; }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: flex; }
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-logo">P</div>
                    <div class="brand-text">
                        <h1>Python 学习</h1>
                        <span>编程学习中心</span>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">总课程</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="completedCount">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="progressPercent">0%</div>
                        <div class="stat-label">进度</div>
                    </div>
                </div>
            </div>
            <div class="course-nav" id="courseNav">
                <div style="padding:20px;color:var(--text-muted);text-align:center;">请先选择课程文件夹</div>
            </div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
                    </button>
                    <div class="breadcrumb" id="breadcrumb">
                        <span class="breadcrumb-item">首页</span>
                    </div>
                </div>
                <div class="top-bar-actions">
                    <button class="action-btn" onclick="goHome()">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-9M3 9h6M3 9v6"/></svg>
                        首页
                    </button>
                    <button class="action-btn primary" onclick="openFolder()">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h4l2 2h6a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
                        选择文件夹
                    </button>
                </div>
            </div>

            <div class="content-area">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-hero">🐍</div>
                    <h1 class="welcome-title">Python 编程学习中心</h1>
                    <p class="welcome-desc">
                        点击右上角「选择文件夹」按钮，导入你的风变编程课程文件夹，即可开始学习。
                        支持课程导航、学习进度自动保存。
                    </p>
                    <div class="course-grid" id="courseGrid">
                        <div class="course-card" style="--card-color: #6366f1" onclick="openFolder()">
                            <div class="course-card-icon">📁</div>
                            <h3>导入课程</h3>
                            <p>点击选择风变编程文件夹</p>
                        </div>
                        <div class="course-card" style="--card-color: #06b6d4" onclick="showHelp()">
                            <div class="course-card-icon">❓</div>
                            <h3>使用帮助</h3>
                            <p>了解如何导入课程</p>
                        </div>
                    </div>
                </div>

                <div class="learning-frame" id="learningFrame">
                    <div class="frame-toolbar">
                        <div class="frame-nav">
                            <button class="frame-nav-btn" id="prevBtn" onclick="prevLesson()">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 8l-6 6M15 8H9M15 8v6"/></svg>
                            </button>
                            <button class="frame-nav-btn" id="nextBtn" onclick="nextLesson()">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 8l6 6M9 8h6M9 8v6"/></svg>
                            </button>
                        </div>
                        <div class="frame-progress" id="frameProgress">0 / 0</div>
                        <div class="top-bar-actions">
                            <button class="action-btn" onclick="markComplete()">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>
                                标记完成
                            </button>
                            <button class="action-btn" onclick="refreshFrame()">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v4h4M11 8v-4h-4"/><path d="M3.5 9A6 6 0 1012 3"/></svg>
                                刷新
                            </button>
                        </div>
                    </div>
                    <div class="frame-container">
                        <div class="frame-loading" id="frameLoading">
                            <div class="loader-ring"></div>
                            <span>正在加载课程...</span>
                        </div>
                        <iframe class="learning-iframe" id="learningIframe" onload="onFrameLoad()"></iframe>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="error-toast" id="errorToast"></div>
    <input type="file" id="folderInput" webkitdirectory multiple style="display:none" onchange="handleFolderSelect(event)">

    <script>
        const courses = {
            syntax: { id: 'syntax', name: 'Python 基础语法', icon: '📚', color: '#6366f1', chapters: [] },
            crawler: { id: 'crawler', name: 'Python 爬虫', icon: '🕷️', color: '#06b6d4', chapters: [] },
            automation: { id: 'automation', name: '办公自动化', icon: '⚡', color: '#f59e0b', chapters: [] },
            analysis: { id: 'analysis', name: '数据分析', icon: '📊', color: '#22c55e', chapters: [] }
        };

        let allLessons = [];
        let currentIndex = -1;
        let progress = {};

        function init() {
            loadProgress();
            updateStats();
        }
        init();

        function renderCourses() {
            const nav = document.getElementById('courseNav');
            let html = '';
            let total = 0;
            
            for (const [key, course] of Object.entries(courses)) {
                const completed = course.chapters.filter(ch => progress[ch.id]).length;
                html += `
                    <div class="course-section" data-course="${key}">
                        <div class="course-section-header" onclick="toggleSection('${key}')">
                            <div class="course-section-icon" style="background: ${course.color}">${course.icon}</div>
                            <div class="course-section-info">
                                <div class="course-section-name">${course.name}</div>
                                <div class="course-section-meta">${completed}/${course.chapters.length} 章节</div>
                            </div>
                            <div class="course-section-arrow">▼</div>
                        </div>
                        <div class="course-items" id="items-${key}">
                            ${course.chapters.map((ch, i) => `
                                <div class="course-item ${progress[ch.id] ? 'completed' : ''}" 
                                     data-index="${allLessons.indexOf(ch)}"
                                     onclick="loadLesson(${allLessons.indexOf(ch)})">
                                    <div class="course-item-num">${i + 1}</div>
                                    <div class="course-item-name">${ch.name}</div>
                                    <div class="course-item-status"></div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                total += course.chapters.length;
            }
            
            nav.innerHTML = html || '<div style="padding:20px;color:var(--text-muted);text-align:center;">请先选择课程文件夹</div>';
        }

        function toggleSection(courseId) {
            const header = document.querySelector(`[data-course="${courseId}"] .course-section-header`);
            const items = document.getElementById(`items-${courseId}`);
            header.classList.toggle('expanded');
            items.classList.toggle('expanded');
        }

        function openFolder() {
            document.getElementById('folderInput').click();
        }

        function handleFolderSelect(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;

            const basePath = files[0].webkitRelativePath?.split('/')[0] || '';
            localStorage.setItem('courseBasePath', basePath);
            
            parseFiles(files);
            renderCourses();
            updateStats();
            
            showToast(`成功导入 ${allLessons.length} 个课程`);
            
            if (allLessons.length > 0) {
                loadLesson(0);
            }
        }

        function parseFiles(files) {
            for (const key in courses) courses[key].chapters = [];
            allLessons = [];

            const courseFolders = {
                '【1】Python基础语法': 'syntax',
                '【2】Python爬虫精讲': 'crawler',
                '【3】python办公自动化': 'automation',
                '【4】Python数据分析实战': 'analysis'
            };

            files.forEach(file => {
                const path = file.webkitRelativePath || file.name;
                
                for (const [folder, courseKey] of Object.entries(courseFolders)) {
                    if (path.includes(folder)) {
                        const name = extractLessonName(file.name);
                        if (name) {
                            const lesson = {
                                id: `lesson_${allLessons.length}`,
                                name: name,
                                file: file,
                                course: courseKey,
                                path: path
                            };
                            courses[courseKey].chapters.push(lesson);
                            allLessons.push(lesson);
                        }
                        break;
                    }
                }
            });

            for (const key in courses) {
                courses[key].chapters.sort((a, b) => extractNumber(a.name) - extractNumber(b.name));
            }
            allLessons = Object.values(courses).flatMap(c => c.chapters);
        }

        function extractLessonName(filename) {
            let name = filename.replace('.html', '');
            if (/^[\u0000-\u00ff]+$/.test(name)) {
                try {
                    const bytes = [];
                    for (let i = 0; i < name.length; i++) bytes.push(name.charCodeAt(i));
                    name = new TextDecoder('gbk').decode(new Uint8Array(bytes));
                } catch (e) {}
            }
            return name.replace(/^\d+关[-_]/, '') || filename;
        }

        function extractNumber(name) {
            const match = name.match(/(\d+)/);
            return match ? parseInt(match[1]) : 0;
        }

        function loadLesson(index) {
            if (index < 0 || index >= allLessons.length) return;
            currentIndex = index;
            const lesson = allLessons[index];

            document.querySelectorAll('.course-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-index="${index}"]`)?.classList.add('active');

            const course = courses[lesson.course];
            document.getElementById('breadcrumb').innerHTML = `
                <span class="breadcrumb-item">${course.name}</span>
                <span class="breadcrumb-sep">/</span>
                <span class="breadcrumb-item current">${lesson.name}</span>
            `;

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('learningFrame').classList.add('active');
            document.getElementById('frameLoading').classList.remove('hidden');

            const url = URL.createObjectURL(lesson.file);
            document.getElementById('learningIframe').src = url;

            updateNavButtons();
            updateProgressDisplay();
            saveProgress();
        }

        function prevLesson() { if (currentIndex > 0) loadLesson(currentIndex - 1); }
        function nextLesson() { if (currentIndex < allLessons.length - 1) loadLesson(currentIndex + 1); }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentIndex <= 0;
            document.getElementById('nextBtn').disabled = currentIndex >= allLessons.length - 1;
        }

        function updateProgressDisplay() {
            document.getElementById('frameProgress').textContent = `${currentIndex + 1} / ${allLessons.length}`;
        }

        function markComplete() {
            if (currentIndex < 0) return;
            progress[allLessons[currentIndex].id] = true;
            saveProgress();
            updateStats();
            document.querySelector(`[data-index="${currentIndex}"]`)?.classList.add('completed');
            showToast('已标记为完成 ✓');
        }

        function onFrameLoad() {
            document.getElementById('frameLoading').classList.add('hidden');
        }

        function refreshFrame() {
            document.getElementById('frameLoading').classList.remove('hidden');
            document.getElementById('learningIframe').contentWindow?.location.reload();
        }

        function goHome() {
            currentIndex = -1;
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('learningFrame').classList.remove('active');
            document.getElementById('breadcrumb').innerHTML = '<span class="breadcrumb-item">首页</span>';
        }

        function updateStats() {
            const total = allLessons.length;
            const completed = allLessons.filter(l => progress[l.id]).length;
            const percent = total > 0 ? Math.round(completed / total * 100) : 0;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('progressPercent').textContent = percent + '%';
        }

        function saveProgress() {
            localStorage.setItem('pythonLearningProgress', JSON.stringify(progress));
        }

        function loadProgress() {
            try {
                progress = JSON.parse(localStorage.getItem('pythonLearningProgress') || '{}');
            } catch (e) { progress = {}; }
        }

        function showToast(msg) {
            const toast = document.getElementById('errorToast');
            toast.textContent = msg;
            toast.style.background = '#22c55e';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showHelp() {
            alert('使用说明：\n\n1. 点击「选择文件夹」按钮\n2. 选择风变编程课程文件夹（如：Python基础语法、Python爬虫精讲等）\n3. 应用会自动解析课程内容\n4. 点击左侧课程即可开始学习\n5. 学习进度会自动保存');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }
    </script>
</body>
</html>
